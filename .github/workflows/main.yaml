name: AI DevOps CI/CD Demo using GitHub Actions

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Create virtual environment and install dependencies
      - name: Create Virtual Environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Generate tests using OpenAI
      - name: AI Test Generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          source venv/bin/activate
          python generate_tests.py

      # 5. Run pytest
      - name: Run Tests
        run: |
          source venv/bin/activate
          pytest

      # 6. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-devops-advanced .

      # 7. Login to DockerHub
      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
            docker login -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # 8. Push Docker image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-devops-advanced

      # 9. AI log analysis if any previous step fails
      - name: AI Log Analysis (on failure)
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Analyzing failure..."
          LOG=$(tail -n 50 $GITHUB_STEP_SUMMARY || echo "No logs")
          source venv/bin/activate
          python analyze_logs.py "$LOG"
