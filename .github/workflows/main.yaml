# Create a GitHub Actions workflow for a Python Flask app CI/CD pipeline
#
# Requirements:
# - Trigger on push to main and pull_request
# - Use ubuntu-latest runner
#
# Steps:
# 1. Checkout code
# 2. Setup Python 3.12
# 3. Create virtual environment (venv)
# 4. Install dependencies from requirements.txt
# 5. Run AI test generation script (generate_tests.py)
# - use OPENAI_API_KEY from GitHub secrets
# 6. Run pytest
# 7. Build Docker image
# - tag: ${{ secrets.DOCKER_USERNAME }}/ai-devops-advanced
# 8. Login to DockerHub using secrets
# 9. Push Docker image
#
# Failure handling:
# - If any step fails, run analyze_logs.py
# - Pass logs to script
#
# Best practices:
# - Use environment variables for secrets
# - Use separate steps for clarity
# - Ensure commands run inside venv
# - Keep workflow clean and production-ready

name: AI DevOps CI/CD Demo using GitHub Actions

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Virtual Environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: AI Test Generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          source venv/bin/activate
          python generate_tests.py

      - name: Run Tests
        run: |
          source venv/bin/activate
          pytest

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-devops-advanced .

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-devops-advanced

      - name: AI Log Analysis (on failure)
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Analyzing failure..."
          LOG=$(tail -n 50 "$GITHUB_STEP_SUMMARY" || echo "No logs")
          source venv/bin/activate
          python analyze_logs.py "$LOG"